name: CI - tests and coverage
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - '!*' # Do not execute on tags
    paths:
      - '*.js'
      - '*.ts'
      - '*.json'
      - '*.yaml'
      - '.github/workflows/**'
      - 'test/**'
      - 'examples/**'
      - 'mjs/**'
      - 'scripts/**'
      - 'src/*'
      - 'src/**/*'
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        platform: [ ubuntu-latest ]
        node: [ '22', '24' ]
    name: test/node ${{ matrix.node }}/${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v6
    - uses: pnpm/action-setup@v5
      with:
        run_install: false
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node }}
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm run quality
    - run: pnpm run test
    - run: pnpm run examples
  package:
    strategy:
      fail-fast: false
      matrix:
        node: [ '22', '24' ]
        nodemailer: [ '6.10.1', '7.0.13', '8.0.11', '9.1.1', '10.0.9' ]
    name: package/node ${{ matrix.node }}/nodemailer ${{ matrix.nodemailer }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: pnpm/action-setup@v5
      with:
        run_install: false
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node }}
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm run test:package ${{ matrix.nodemailer }}
  coverage:
    needs: [ test, package ]
    name: coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: pnpm/action-setup@v5
      with:
        run_install: false
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm run nyc
    - uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/lcov.info
        fail_ci_if_error: true
